# Every OMMS v0.2.2 construct in one model: all ten threshold operators, both
# metrics, both units, every argument, `type: text`, and the shared
# custom-property and authoritative-definition structures at several levels.
#
# The model is illustrative, not a maturity model to adopt: several criteria
# exist only to show an operator or an argument. Each criterion names the
# construct it demonstrates.

kind: MaturityModel
apiVersion: v0.2.2
id: 5b7e1d94-2c63-4f18-9a7e-3d5b8c1f6a20
name: full-kitchen-sink-maturity-model
version: 0.1.0
status: draft
description:
  purpose: >
    Illustrative maturity model exercising every construct in OMMS v0.2.2.
  limitations: >
    Not a maturity model to adopt. Several thresholds are arbitrary, chosen
    to demonstrate an operator rather than to measure anything.
  usage: >
    Read alongside the standard's documentation. Policies are evaluated
    first, then each level's criteria in order; the first level where any
    criterion fails caps the artifact.
tags:
  - example
  - kitchen-sink
targetApplication: ODPS
targetApiVersion: v1.1.0

customProperties:
  - property: exampleOf
    value: OMMS v0.2.2
    description: Records that this model is illustrative only.

authoritativeDefinitions:
  - type: canonicalUrl
    url: https://github.com/bitol-io/open-maturity-model-standard
    description: OMMS, the standard whose syntax this model uses.

policies:
  - id: POL-P01
    name: statusCap
    property: status
    type: library
    metric: valueOf
    arguments:
      caps:
        retired: 0
        deprecated: 1
        proposed: 1
        draft: 2
        active: 5
    description: >
      Status determines the maximum achievable maturity level. Evaluated
      before all level criteria; the cap is instant and absolute.

  - id: POL-P02
    name: selfSourcing
    property: inputPorts
    type: library
    metric: valueOf
    arguments:
      where:
        field: name
        in: [self]
      contractIdMustMatch: product.id
      versionMustMatch: product.version
    description: >
      A data product that generates data without external sources must use
      the "self" convention: when inputPort.name is "self", contractId must
      equal the product id and version must equal the product version.

levels:
  - level: 1
    name: Structural
    description: The artifact is syntactically valid and identifies itself.
    tags:
      - structural
    criteria:
      - id: L1-P01
        property: kind
        type: library
        metric: valueOf
        mustBe: DataProduct
        description: "`mustBe` with a string: kind must equal DataProduct."

      - id: L1-P02
        property: apiVersion
        type: library
        metric: valueOf
        mustBeGreaterOrEqualTo: v1.0.0
        description: >
          `mustBeGreaterOrEqualTo` with a version string: the standard version
          gate is v1.0.0 or newer.

      - id: L1-P03
        property: apiVersion
        type: library
        metric: valueOf
        mustBe: latest
        description: >
          `mustBe: latest` instructs the evaluator to resolve to the current
          version of the target standard.

      - id: L1-P04
        property: outputPorts
        type: library
        metric: count
        mustBeGreaterThan: 0
        unit: rows
        description: "`mustBeGreaterThan`: at least one output port is defined."

      - id: L1-P05
        property: name
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: "`count` on a single value: the product name is present."

      - id: L1-P06
        property: jsonSchemaValidation
        type: text
        metric: count
        mustBe: 0
        unit: rows
        description: >
          `type: text` — auto-pass. The criterion documents an expectation the
          evaluator does not resolve on its own, and it scores as met.

  - level: 2
    name: Descriptive
    description: A human can understand what the artifact contains.
    criteria:
      - id: L2-P01
        property: tags
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one tag.

      - id: L2-P02
        property: outputPorts[].description
        type: library
        metric: count
        mustBeGreaterThan: 80
        unit: percent
        description: >
          `unit: percent`: more than 80% of output ports have a description.

      - id: L2-P03
        property: outputPorts[]
        type: library
        metric: count
        mustBeLessOrEqualTo: 20
        unit: rows
        description: "`mustBeLessOrEqualTo`: no more than 20 output ports."

      - id: L2-P04
        property: team.members[].role
        type: library
        metric: count
        mustNotBe: 0
        unit: rows
        description: "`mustNotBe`: the role count is not zero."

  - level: 3
    name: Governed
    description: Someone is accountable, and the artifact is cross-referenced.
    criteria:
      - id: L3-P01
        property: team.members[]
        type: library
        metric: count
        arguments:
          having: role
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          `arguments.having`: at least one team member declares a role.

      - id: L3-P02
        property: authoritativeDefinitions
        type: library
        metric: count
        arguments:
          where:
            field: type
            in: [canonicalUrl]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          `arguments.where` with `field` and `in`: a root-level canonicalUrl
          entry is required.

      - id: L3-P03
        property: team.members[].replacedByUsername
        type: library
        metric: count
        arguments:
          relatesTo: team.members[].role
          where:
            field: team.members[].dateOut
            isNotNull: true
        mustBe: 100
        unit: percent
        description: >
          `arguments.where.isNotNull` with a `relatesTo` resolved inside the
          same document: when two members share a role and one has departed,
          the successor must be named.

      - id: L3-P04
        property: outputPorts[].contractId
        type: library
        metric: count
        arguments:
          relatesTo: "[DataContract].status"
          where:
            field: status
            in: [active]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          `relatesTo` with bracket notation: at least one output port
          references an ODCS contract whose status is active.

  - level: 4
    name: AI-Ready
    description: A machine consumer can use the artifact safely.
    criteria:
      - id: L4-P01
        property: outputPorts[]
        type: library
        metric: count
        arguments:
          having: sbom
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one output port version declares an SBOM.

      - id: L4-P02
        property: managementPorts[]
        type: library
        metric: count
        arguments:
          anyOf: [content, description]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          `arguments.anyOf`: at least one management port declares a content
          type or a description.

      - id: L4-P03
        property: quality[].dimension
        type: library
        metric: count
        arguments:
          distinct: true
          in:
            - accuracy
            - completeness
            - conformity
            - consistency
            - coverage
            - timeliness
            - uniqueness
        mustBeGreaterOrEqualTo: 3
        unit: rows
        description: >
          `arguments.distinct` with `arguments.in`: at least 3 of the 7 Data QoS
          dimensions are represented across all quality rules.

      - id: L4-P04
        property: status
        type: library
        metric: valueOf
        mustBeIn: [proposed, draft, active, deprecated, retired]
        description: "`mustBeIn`: the status is one of the ODPS values."

      - id: L4-P05
        property: quality[].dimension
        type: library
        metric: count
        arguments:
          in:
            - completeness
        mustBeBetween: [1, 10]
        unit: rows
        description: "`mustBeBetween`: an inclusive range [min, max]."

  - level: 5
    name: Optimized
    description: Coverage is complete and continuously measured.
    criteria:
      - id: L5-P01
        property: outputPorts[].quality
        type: library
        metric: count
        mustNotBeBetween: [3, 7]
        unit: rows
        description: "`mustNotBeBetween`: an exclusive range."

      - id: L5-P02
        property: outputPorts[].contractId
        type: library
        metric: count
        arguments:
          having: inputContracts
        mustBeGreaterOrEqualTo: 50
        unit: percent
        description: >
          At least half of the output ports declare their input contracts.

      - id: L5-P03
        property: pricing
        type: library
        metric: valueOf
        mustNotBeIn: [unknown, tbd]
        description: "`mustNotBeIn`: the pricing model is not left undecided."
