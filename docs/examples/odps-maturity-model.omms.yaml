# =============================================================================
# ODPS Data Product Maturity Model — v2.1.0
# Using Open Maturity Model Standard (OMMS) v0.2.1 (RFC-0037)
# Targets ODPS v1.1.0 (RFC-0038 `context` block)
# =============================================================================
#
# Changes from model v2.0.0:
#
#   Rewritten for OMMS v0.2.1, which replaces the ODCS data quality metrics
#   with two of its own: `valueOf` (read a value) and `count` (count the
#   items present, or their share with `unit: percent`). Every check means
#   what it meant in v2.0.0; criteria IDs are unchanged.
#
# Changes from model v1.0.0 (file odps-maturity-model-v1.0.0.yml):
#
#   Levels 1–3 are unchanged. Products carry no quality dimension of their
#   own (quality is delegated to the linked ODCS contracts), so there is
#   nothing to move down to Level 3.
#
#   Level 4 becomes AI-READY: the ODPS gate steps up to v1.1.0 and the
#   RFC-0038 `context` block is required at product level, plus at least
#   one output port whose linked contract carries its own context. The
#   existing observability / SBOM / inputContracts criteria stay.
#
#   Level 5 adds depth of context: every output port and every linked
#   output contract contextualised, answered verified statements.
#
#   Criteria IDs L4-Pxx / L5-Pxx are extended, not renumbered.
# =============================================================================
kind: MaturityModel
apiVersion: v0.2.1
id: 3c8a1f47-6d9e-4a2b-b5f3-9e2d4c7a8b1f
name: odps-data-product-maturity-model
version: 2.1.0
status: active
description:
  purpose: >
    Measurable maturity model for Open Data Product Standard (ODPS) data
    products. All criteria are factual and quantifiable. Level 4 certifies
    a product as AI-ready: observable, dependency-transparent, and carrying
    the context an AI agent needs to use it safely.
  limitations: >
    Criteria are designed for ODPS v1.1.0. Levels 4 and 5 require the
    RFC-0038 `context` block introduced in v1.1.0; products on earlier
    editions cap at Level 3. The "latest" apiVersion gate at Levels 4 and 5
    means the threshold tracks future ODPS releases. Quality enforcement is
    delegated to linked ODCS contracts, not evaluated within this model.
    Input ports carry no context of their own — they refer to the linked
    contract's context — so only output ports are assessed.
  usage: >
    Evaluate a data product YAML file against policies first, then each
    level's criteria sequentially. A product must satisfy all criteria
    of a level (and all lower levels) to qualify. The first level where
    any criterion fails is the ceiling.
tags:
  - maturity-model
  - odps
  - data-product
  - sbom
  - ai-ready
targetApplication: ODPS
targetApiVersion: v1.1.0
customProperties:
  - property: dataQoSReference
    value: "Perrin, 2023"
    description: >
      Data QoS dimensions (Accuracy, Completeness, Conformity, Consistency,
      Coverage, Timeliness, Uniqueness) per Jean-Georges Perrin, 2023.
  - property: contextReference
    value: "RFC-0038"
    description: >
      AI and semantic context block (instructions, verifiedStatements,
      constraints) introduced in ODPS v1.1.0 at product and output-port
      level.
authoritativeDefinitions:
  - type: canonicalUrl
    url: https://github.com/bitol-io/open-data-product-standard
    description: ODPS repository.
  - type: businessDefinition
    url: https://bitol.io/announcing-odps-major-step-toward-standardizing-data-products/
    description: ODPS v0.9.0 announcement describing data product philosophy.
  - type: businessDefinition
    url: https://dataintelligenceplatform.substack.com/p/five-levels-between-chaos-and-almost
    description: >
      "Five Levels Between Chaos and (Almost) AI-Ready Data" by
      Jean-Georges Perrin, 2026.

# =============================================================================
# Policies
# =============================================================================
# Policies are evaluated before any level criteria. They express
# organizational decisions that override or constrain criteria evaluation.
# =============================================================================

policies:
  # ---------------------------------------------------------------------------
  # POL-P01: Status determines the maximum achievable maturity level.
  # ---------------------------------------------------------------------------
  - id: POL-P01
    name: statusCap
    property: status
    type: library
    metric: valueOf
    arguments:
      caps:
        retired: 0
        deprecated: 2
        proposed: 1
        draft: 1
        active: 5
    description: >
      Status determines the maximum achievable maturity level. Evaluated
      before all level criteria. The cap is instant and absolute: a
      retired product is always L0, a deprecated product is hard-capped
      at L2 regardless of criteria met, and proposed/draft products
      cannot exceed L1. Only active products can progress through all
      levels.

  # ---------------------------------------------------------------------------
  # POL-P02: Self-sourcing convention for data-generating products.
  # ---------------------------------------------------------------------------
  - id: POL-P02
    name: selfSourcing
    property: inputPorts
    type: library
    metric: valueOf
    arguments:
      where:
        field: name
        in: [self]
      contractIdMustMatch: product.id
      versionMustMatch: product.version
    description: >
      Data products that generate data without external sources (e.g.,
      synthetic data generators, IoT sensor products) must use the "self"
      convention: inputPort name is "self", contractId must equal the
      product id, and version must equal the product version.

# =============================================================================
# Maturity Levels
# =============================================================================
# Levels are cumulative: a product must satisfy all lower levels to qualify.
#
#   L1 Structural    — it is a valid product
#   L2 Discoverable  — a consumer can find and evaluate it
#   L3 Governed      — someone is accountable; the production-ready gate
#   L4 AI-Ready      — a machine (observer, AI agent) can use it safely
#   L5 Optimized     — a living product with complete context
#
# Criteria:
#   type: library     — machine-evaluable criterion
#   type: text        — human-readable criterion (auto-pass)
#
#   metric: valueOf   — read the value and compare it to the threshold
#   metric: count     — count the items present (their share with percent)
#
#   unit: rows    — count of items
#   unit: percent — percentage (0-100)
#
# Arguments extend metrics for complex evaluations:
#   having     — item must have these fields present
#   anyOf      — item must have at least one of these fields
#   where      — filter items by field value
#   distinct   — count unique values only
#   relatesTo  — resolve cross-artifact or intra-file dependency
#   in         — count only the items whose value is in this list
# =============================================================================

levels:
  # ===========================================================================
  # LEVEL 1 — STRUCTURAL (Valid Data Product)
  # ===========================================================================
  - level: 1
    name: Structural
    description: >
      The product is syntactically valid, machine-readable, and contains
      the minimum required fields to identify a data product and its
      output ports. A catalog can register it. Think of it as "compiles
      without errors."

    criteria:
      - id: L1-P01
        property: apiVersion
        type: library
        metric: valueOf
        mustBeGreaterOrEqualTo: v1.0.0
        description: ODPS standard version is at least v1.0.0.

      - id: L1-P02
        property: kind
        type: library
        metric: valueOf
        mustBe: DataProduct
        description: kind must equal DataProduct.

      - id: L1-P03
        property: id
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: id must be present (not null, not empty). UUID recommended.

      - id: L1-P04
        property: status
        type: library
        metric: valueOf
        mustBeIn: [proposed, draft, active, deprecated, retired]
        description: Status field is present and contains a valid ODPS status value.

      - id: L1-P05
        property: outputPorts
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one output port is defined.

      - id: L1-P06
        property: outputPorts[].name
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: 100% of output ports have a name.

      - id: L1-P07
        property: outputPorts[].contractId
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: 100% of output ports have a contractId linking to an ODCS contract.

  # ===========================================================================
  # LEVEL 2 — DISCOVERABLE (Findable and Evaluable)
  # ===========================================================================
  - level: 2
    name: Discoverable
    description: >
      The product carries enough metadata for a consumer to find it in a
      Marketplace, understand what it offers, and decide if it is relevant.
      Both input and output sides are declared.

    criteria:
      - id: L2-P01
        property: status
        type: library
        metric: valueOf
        mustBeIn: [active, deprecated]
        description: Status must be active or deprecated.

      - id: L2-P02
        property: name
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Product name must be present (not null, not empty).

      - id: L2-P03
        property: version
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Version is present and follows SemVer format.

      - id: L2-P04
        property: domain
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Business domain is specified.

      - id: L2-P05
        property: tags[]
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one tag.

      - id: L2-P06
        property: description.purpose
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Purpose of the data product is documented.

      - id: L2-P07
        property: description.usage
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Usage guidance is documented.

      - id: L2-P08
        property: outputPorts[].description
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: 100% of output ports have a description.

      - id: L2-P09
        property: outputPorts[].type
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: 100% of output ports have a type.

      - id: L2-P10
        property: inputPorts
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          At least one input port is declared. Products that generate data
          without external sources must use the "self" convention
          (name: self, contractId: product id, version: product version).

      - id: L2-P11
        property: inputPorts[].name
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: 100% of input ports have a name.

      - id: L2-P12
        property: inputPorts[].contractId
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: 100% of input ports have a contractId.

  # ===========================================================================
  # LEVEL 3 — GOVERNED (Operationally Accountable)
  # ===========================================================================
  - level: 3
    name: Governed
    description: >
      The product has clear ownership, support channels, versioned
      dependencies, and at least one live output contract. Someone is
      accountable and reachable. This is the production-ready gate.

    criteria:
      - id: L3-P01
        property: status
        type: library
        metric: valueOf
        mustBe: active
        description: Status must be active. Only active products can be governed.

      - id: L3-P02
        property: version
        type: library
        metric: valueOf
        mustBeGreaterOrEqualTo: v1.0.0
        description: Product version must be at least v1.0.0 (production).

      - id: L3-P03
        property: team.members[]
        type: library
        metric: count
        arguments:
          where:
            field: role
            in: [owner]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one team member with role "owner."

      - id: L3-P04
        property: support[]
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one support channel.

      - id: L3-P05
        property: inputPorts[].version
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: 100% of input ports are versioned.

      - id: L3-P06
        property: outputPorts[].contractId
        type: library
        metric: count
        arguments:
          relatesTo: "[DataContract].status"
          where:
            field: status
            in: [active]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          At least one outputPort.contractId references an ODCS
          DataContract with status: active. This is the production-ready
          gate: the product must have at least one live, active contract
          to qualify for governance.

  # ===========================================================================
  # LEVEL 4 — AI-READY (Observable, Transparent, Safe for Machine Consumers)
  # ===========================================================================
  - level: 4
    name: AI-Ready
    description: >
      The product is consumable by machines without a human in the loop.
      It is instrumented for observation, declares its dependencies
      transparently via SBOM and inputContracts, provides management
      endpoints — and the RFC-0038 context block gives AI agents, LLMs,
      and semantic layers explicit instructions, constraints, and verified
      statements so they use the product correctly.

    criteria:
      - id: L4-P01
        property: apiVersion
        type: library
        metric: valueOf
        mustBeGreaterOrEqualTo: v1.1.0
        description: Must use ODPS v1.1.0 or later (introduces the context block).

      # --- Observability and transparency ---

      - id: L4-P02
        property: managementPorts[]
        type: library
        metric: count
        arguments:
          where:
            field: content
            in: [observability]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one management port with content "observability."

      - id: L4-P03
        property: managementPorts[]
        type: library
        metric: count
        arguments:
          where:
            field: content
            in: [discoverability]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one management port with content "discoverability."

      - id: L4-P04
        property: outputPorts[]
        type: library
        metric: count
        arguments:
          having: sbom
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one output port version has an SBOM declared.

      - id: L4-P05
        property: description.limitations
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Limitations of the data product are documented.

      - id: L4-P06
        property: authoritativeDefinitions[]
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one authoritative definition at root level.

      - id: L4-P07
        property: outputPorts[]
        type: library
        metric: count
        arguments:
          having: inputContracts
        mustBeGreaterOrEqualTo: 50
        unit: percent
        description: ">= 50% of output ports have inputContracts declared."

      # --- AI context (RFC-0038) ---

      - id: L4-P08
        property: context.instructions
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: >
          Product-level context.instructions is present: natural-language
          guidance for AI agents on how to use this data product.

      - id: L4-P09
        property: context.constraints
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          At least one product-level context constraint: negative guidance
          on what AI agents must NOT do with this product.

      - id: L4-P10
        property: context.verifiedStatements
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          At least one product-level verified statement: a canonical
          question an agent should be able to answer from this product.

      - id: L4-P11
        property: outputPorts[].contractId
        type: library
        metric: count
        arguments:
          relatesTo: "[DataContract].context"
          where:
            field: context
            isNotNull: true
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          At least one output port's linked ODCS contract carries its own
          context block. A product is only as AI-ready as the data it
          exposes.

  # ===========================================================================
  # LEVEL 5 — OPTIMIZED (Living Product, Fully Contextualised)
  # ===========================================================================
  - level: 5
    name: Optimized
    description: >
      The product achieves full lifecycle management, complete dependency
      transparency, and continuous improvement. It is a living, evolving
      product with institutional continuity, and every port and every
      exposed contract carries the context an AI agent needs.

    criteria:
      - id: L5-P01
        property: managementPorts[]
        type: library
        metric: count
        arguments:
          where:
            field: content
            in: [control]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: At least one management port with content "control."

      - id: L5-P02
        property: outputPorts[]
        type: library
        metric: count
        arguments:
          having: sbom
        mustBe: 100
        unit: percent
        description: 100% of output port versions have an SBOM declared.

      - id: L5-P03
        property: outputPorts[]
        type: library
        metric: count
        arguments:
          having: inputContracts
        mustBe: 100
        unit: percent
        description: 100% of output ports have inputContracts fully declared.

      - id: L5-P04
        property: team.members[].dateIn
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: dateIn is tracked for all team members.

      - id: L5-P05
        property: team.members[].replacedByUsername
        type: library
        metric: count
        arguments:
          relatesTo: team.members[].role
          where:
            field: team.members[].dateOut
            isNotNull: true
        mustBe: 100
        unit: percent
        description: >
          When two or more team members share the same role and one has
          departed (dateOut is set), replacedByUsername must point to the
          successor's username.

      - id: L5-P06
        property: version
        type: library
        metric: valueOf
        mustBeGreaterThan: v1.0.0
        description: >
          Product version is greater than v1.0.0, proving at least one
          iteration since initial production release.

      - id: L5-P07
        property: productCreatedTs
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Product creation timestamp is set (ISO 8601 UTC).

      - id: L5-P08
        property: authoritativeDefinitions[]
        type: library
        metric: count
        arguments:
          where:
            field: type
            in: [canonicalUrl]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: Root-level canonicalUrl entry pointing to the product's stable URL.

      - id: L5-P09
        property: authoritativeDefinitions[]
        type: library
        metric: count
        arguments:
          where:
            field: type
            in: [businessDefinition]
        mustBeGreaterOrEqualTo: 1
        unit: rows
        description: >
          At least one businessDefinition linking to the product's
          business context.

      - id: L5-P10
        property: tenant
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Tenant / organization is identified (not null, not empty).

      # --- AI context depth (RFC-0038) ---

      - id: L5-P11
        property: context.verifiedStatements
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 3
        unit: rows
        description: >
          At least three product-level verified statements, giving agents a
          representative set of canonical questions for this product.

      - id: L5-P12
        property: context.verifiedStatements[].answer
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 50
        unit: percent
        description: >
          >= 50% of verified statements carry a curated answer that agents
          return verbatim when a query is semantically close.

      - id: L5-P13
        property: outputPorts[].context
        type: library
        metric: count
        mustBe: 100
        unit: percent
        description: >
          100% of output ports carry their own context block, scoping AI
          guidance to the port rather than only the product.

      - id: L5-P14
        property: outputPorts[].contractId
        type: library
        metric: count
        arguments:
          relatesTo: "[DataContract].context"
          where:
            field: context
            isNotNull: true
        mustBe: 100
        unit: percent
        description: >
          100% of output ports link to an ODCS contract that carries its
          own context block.
