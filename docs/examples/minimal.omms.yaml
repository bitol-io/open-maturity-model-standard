kind: MaturityModel
apiVersion: v0.2.2
id: 9f3a2c17-8b4d-4e6a-a1f5-7d9c3e8b2a4f
name: example-maturity-model
version: 0.1.0
status: draft
description:
  purpose: Example maturity model demonstrating OMMS v0.2.2 syntax.
tags:
  - example
targetApplication: ODCS
targetApiVersion: v3.1.0

policies:
  - id: POL-C01
    name: statusCap
    property: status
    type: library
    metric: valueOf
    arguments:
      caps:
        retired: 0
        active: 5
    description: Retired contracts score L0.

levels:
  - level: 1
    name: Basic
    description: Minimum valid artifact.
    criteria:
      - id: L1-C01
        property: kind
        type: library
        metric: valueOf
        mustBe: DataContract
        description: kind must equal DataContract.

  - level: 2
    name: Enriched
    description: Artifact has business context.
    criteria:
      - id: L2-C01
        property: description.purpose
        type: library
        metric: count
        mustBe: 1
        unit: rows
        description: Purpose is documented.
