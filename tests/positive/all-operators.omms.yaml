# POSITIVE TEST - this document MUST pass schema validation.
# Rule: each of the ten threshold operators is accepted: the eight
# comparisons with count, and mustBeIn / mustNotBeIn with valueOf.
# See docs/criteria.md#threshold-operators.

kind: MaturityModel
apiVersion: v0.2.2
id: 0a1b2c3d-0000-4000-8000-000000000004
name: all-operators
status: draft

levels:
  - level: 1
    name: Basic
    description: Minimum valid artifact.
    criteria:
      - id: L1-C01
        property: schema[]
        type: library
        metric: count
        mustBe: 1
        unit: rows
      - id: L1-C02
        property: schema[]
        type: library
        metric: count
        mustNotBe: 0
        unit: rows
      - id: L1-C03
        property: schema[]
        type: library
        metric: count
        mustBeGreaterThan: 0
        unit: rows
      - id: L1-C04
        property: schema[]
        type: library
        metric: count
        mustBeGreaterOrEqualTo: 1
        unit: rows
      - id: L1-C05
        property: schema[]
        type: library
        metric: count
        mustBeLessThan: 10
        unit: rows
      - id: L1-C06
        property: schema[]
        type: library
        metric: count
        mustBeLessOrEqualTo: 10
        unit: rows
      - id: L1-C07
        property: schema[]
        type: library
        metric: count
        mustBeBetween: [1, 10]
        unit: rows
      - id: L1-C08
        property: schema[]
        type: library
        metric: count
        mustNotBeBetween: [100, 200]
        unit: rows
      - id: L1-C09
        property: status
        type: library
        metric: valueOf
        mustBeIn: [draft, active]
      - id: L1-C10
        property: status
        type: library
        metric: valueOf
        mustNotBeIn: [retired]
