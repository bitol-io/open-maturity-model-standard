name: validvalues-without-operator
status: draft

levels:
  - level: 1
    name: Basic
    description: Minimum valid artifact.
    criteria:
      - id: L1-C01
        property: version
        type: library
        metric: validValues
        description: Version is present, whatever its value.
      - id: L1-C02
        property: status
        type: library
        metric: validValues
        arguments:
          validValues: [proposed, draft, active, deprecated, retired]
        description: Status is present and is one of the listed values.
